name: Daily International Job Alerts

on:
  schedule:
    # Every 4 hours (Cairo time UTC+2)
    - cron: "0 22,2,6,10,14,18 * * *"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run classification tests
        run: python -m unittest discover -s tests -v

      - name: Search jobs and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs_bot.py

      - name: Save job database and dashboard
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.db docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update job alert history"
            git pull --rebase origin main
            git push origin main
          fi
          
