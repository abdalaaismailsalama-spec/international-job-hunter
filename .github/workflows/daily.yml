
name: Daily International Job Alerts

on:
  schedule:
    # 09:00 Cairo time (UTC+2)
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Search jobs and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_hunter.py

      - name: Save deduplication database
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.sqlite3
          if ! git diff --cached --quiet; then
            git commit -m "Update job alert history"
            git pull --rebase origin main
            git push origin main
          fi
          
